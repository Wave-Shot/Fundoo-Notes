# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret.key=ThisIsASecretKeyForFundooNotesLearningProjectOnly123456
jwt.expiration.ms=86400000

# Logging
logging.level.root=INFO

# Show DEBUG level for your own project (so @Around timing logs appear)
logging.level.com.fundoonotes=DEBUG

# Optional: give the aspect its own level explicitly
logging.level.com.fundoonotes.aspect=DEBUG

# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache type
spring.cache.type=redis

# Default TTL for cached items = 10 minutes (in milliseconds)
spring.cache.redis.time-to-live=600000

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom queue/exchange names (we define these, they're just strings)
rabbitmq.exchange=fundoo.exchange
rabbitmq.queue.email=email.queue
rabbitmq.queue.reminder=reminder.queue
rabbitmq.routing.key.email=email.routingkey
rabbitmq.routing.key.reminder=reminder.routingkey

# Prevent Spring Batch from auto-running jobs on startup
spring.batch.job.enabled=false

# Spring Batch needs its own tables in your DB to track job runs
# 'always' creates them automatically
spring.batch.jdbc.initialize-schema=always
